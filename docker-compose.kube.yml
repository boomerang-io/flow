# Local experiment: run service-dispatcher against a laptop Kubernetes (OrbStack) with the
# plain-Jobs executor, plus SeaweedFS as the artifact store. Layer it over the main stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.kube.yml up -d --build service-dispatcher
#
# Prerequisites: OrbStack Kubernetes enabled (`orb config set k8s.enable true`, then restart
# OrbStack) and a kubeconfig at docker/kube/config whose server points at host.docker.internal
# (generate with kubectl config view --context orbstack --minify --flatten --raw, rewrite the
# server, and set insecure-skip-tls-verify - the API cert has no SAN for that host name).
# Dispatcher authentication is switched OFF on service-core here (the documented dev/test
# escape hatch); never carry that into a real deployment.
services:
  # The S3-compatible store for run artifacts (SeaweedFS, Apache-2.0), only needed where a
  # dispatcher runs the upload and download tasks: S3 on :8333, local-only
  # credentials in docker/seaweedfs/s3.json. Production uses a managed store (S3, Cloud Storage) or
  # Rook-Ceph through the same flow.artifacts.store.* settings.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # -ip.bind=0.0.0.0: by default every port binds only the container's own address, so the
    # healthcheck's localhost probe (and anything else inside the container) never answers.
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.telemetry=false
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [flow]

  # S3 does not create a bucket on first upload; this one-shot creates flow's (a no-op once it exists).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name flow-artifacts" | weed shell -master=seaweedfs:9333
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    networks: [flow]

  service-core:
    environment:
      FLOW_DISPATCHER_AUTH_ENABLED: "false"
      FLOW_AGENT_SERVICE_HOST: service-dispatcher:7702
      # Artifacts go to the SeaweedFS below. Links are signed for the host task pods use: OrbStack's
      # cluster reaches it through the host, not the compose network name.
      FLOW_ARTIFACTS_ENABLED: "true"
      FLOW_ARTIFACTS_STORE_ENDPOINT: http://seaweedfs:8333
      FLOW_ARTIFACTS_STORE_LINK_ENDPOINT: http://host.docker.internal:8333
      FLOW_ARTIFACTS_STORE_BUCKET: flow-artifacts
      FLOW_ARTIFACTS_STORE_ACCESS_KEY: flow-local
      FLOW_ARTIFACTS_STORE_SECRET_KEY: flow-local-secret
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully

  service-dispatcher:
    build:
      context: ./service-dispatcher
      dockerfile: Dockerfile
    ports:
      - "7702:7702"
    environment:
      DISPATCHER_EXECUTOR: kube-jobs
      FLOW_DISPATCHER_NAME: orbstack-kube-jobs
      FLOW_ENGINE_SERVICE_HOST: service-core:7700
      FLOW_ENGINE_DISPATCHER_TOKEN: ""
      FLOW_DISPATCHER_LEASE_ENABLED: "true"
      # Spelled out rather than left to the default so the laptop cluster is an explicit place an
      # ai task can be exercised end to end. The pod runs the worker image
      # (FLOW_DISPATCHER_AI_IMAGE, boomerangio/task-ai:1.0.0 by default), which is released from
      # the boomerang-io/tasks repository, so the tag has to exist in the registry before an ai run
      # will get past the image pull.
      FLOW_DISPATCHER_TASK_TYPES: template,custom,script,ai,uploadartifact,downloadartifact
      # Release run-scoped storage promptly so an end-to-end run can assert the claim is gone.
      FLOW_DISPATCHER_WORKSPACE_RECONCILE_ENABLED: "true"
      FLOW_DISPATCHER_WORKSPACE_RECONCILE_MS: "10000"
      KUBECONFIG: /kube/config
      KUBERNETES_TRUST_CERTIFICATES: "true"
      # OrbStack's default StorageClass is ReadWriteOnce-only.
      KUBE_WORKSPACE_STORAGE_ACCESSMODE: ReadWriteOnce
      KUBE_WORKFLOW_STORAGE_ACCESSMODE: ReadWriteOnce
      KUBE_TASK_TIMEOUT: "10"
    volumes:
      - ./docker/kube/config:/kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      service-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7702/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [flow]

volumes:
  seaweedfs_data:
