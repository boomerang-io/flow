server.port=7702
spring.profiles.active=live
info.version=@version.name@
service.name=dispatcher
spring.application.name=${service.name}-${flow.environment}
spring.mvc.async.request-timeout=600000
flow.environment=
flow.instance=bmrg-flow
flow.product=bmrg-flow
flow.version=0.0.0
management.endpoints.web.base-path=/
management.health.elasticsearch.enabled=false
security.mode=none
proxy.enable=false
proxy.host=
proxy.port=
proxy.ignore=
springdoc.swagger-ui.path=/api/docs/swagger-ui
springdoc.api-docs.path=/api/docs/spec
springdoc.packages-to-scan=io.boomerang.controller
# General Config
# The namespace every task Job/TaskRun, PVC and ConfigMap is created in. Blank = the kubeconfig
# context's namespace, or the service-account namespace in-cluster.
kube.namespace=
kube.image.pullPolicy=IfNotPresent
kube.image.pullSecret=boomerang.registrykey
kube.timeout.waitUntil=30
# Backstop grace on the executor watch, added to the task's own budget. The engine owns the
# deadline and reaps first, so this only releases the thread when the watch never fires. Raise it
# where image pulls are slow.
kube.timeout.watchGraceMinutes=2
# How often the executor watch loop reconciles by listing the Job/TaskRun by label, on top of the
# watch event stream - catches a dropped watch connection or a missed event.
kube.timeout.reconcileSeconds=30
# The Job controller writes status.failed before it writes the Failed condition (and the reason,
# e.g. DeadlineExceeded), so kube-jobs's JobWatcher waits this long after first observing
# status.failed >= 1 with no condition yet, before falling back to a generic JobFailed.
kube.timeout.failedConditionGraceSeconds=60
# How long a task's pod may take to START - to leave Pending - apart from how long it may run. A
# pod still not running by then (unschedulable, held by a quota, never created) is reported as
# StartTimeout and the engine requeues the task. 0 turns the check off.
kube.timeout.startMinutes=15
# How long a container may be held on an image it cannot pull (ErrImagePull, ImagePullBackOff,
# InvalidImageName) or a container it cannot create (CreateContainerConfigError) before the task
# fails. These are mistakes in the task, so they are not retried.
kube.timeout.startFailureGraceSeconds=60
# Workspace and Workflow Configuration
kube.workspace.storage.size=1Gi
kube.workspace.storage.class=
kube.workspace.storage.accessMode=ReadWriteMany
kube.workflow.storage.size=1Gi
kube.workflow.storage.class=
kube.workflow.storage.accessMode=ReadWriteMany
# Task configuration
kube.task.backOffLimit=0
kube.task.restartPolicy=Never
kube.task.ttlDays=7
kube.task.deletion=Never
kube.task.timeout=60
kube.task.storage.data.memory=false
dispatcher.tasks.hostaliases=[]
dispatcher.tasks.serviceaccount=
dispatcher.tasks.nodeselector={}
dispatcher.tasks.tolerations=[]
# Kubernetes RuntimeClass for Task Pods (kube-jobs executor only); blank leaves it unset.
dispatcher.tasks.runtimeClassName=
# Task execution runtime (TaskExecutor SPI): tekton | kube-jobs.
dispatcher.executor=tekton
# The results limit handed to a Tekton task as RESULTS_MAX_BYTES: 4096 in Tekton's default
# termination-message mode; raise it to the cluster's max-result-size under sidecar-logs.
tekton.results.maxBytes=4096
# Logging
dispatcher.logging.type=default
dispatcher.logging.host=localhost
dispatcher.logging.port=9200
#dispatcher.logging.type=loki
#dispatcher.logging.host=loki.poc-loki.svc.cluster.local
#dispatcher.logging.port=3100
# Compute resources applied to every task container this deployment runs - one sizing per
# deployment, not per task. Blank means that request or limit is not set at all, so a deployment can
# run with memory limits and no CPU limit, or with none at all. Typically the request is 1/4 to 1/8
# of the limit. A memory-backed /data (kube.task.storage.data.memory) is a tmpfs and counts against
# the memory limit, not ephemeral-storage.
kube.resource.limit.ephemeral-storage=16Gi
kube.resource.request.ephemeral-storage=2Gi
kube.resource.limit.memory=16Gi
kube.resource.request.memory=2Gi
# CPU is unset by default: a CPU limit throttles a task rather than failing it, so an operator opts
# in. Kubernetes CPU units - 1 = one core, 500m = half a core.
kube.resource.limit.cpu=
kube.resource.request.cpu=
# Engine. The dispatcher routes are fixed by the contract (contracts/dispatcher-v1.yaml) under
# /api/v1/dispatcher; only the engine's base URL is configured. Set flow.engine.url for https.
flow.engine.service.host=localhost:7701
flow.engine.url=http://${flow.engine.service.host}
# The task types this dispatcher registers for; the engine hands it claims for these only. `ai` is
# registered by default, so a single-dispatcher install runs AI tasks out of the box; `generic` is
# dispatchable but opt-in. A deployment started with flow.dispatcher.task-types=ai is an AI network
# zone (see README.md).
flow.dispatcher.task-types=template,custom,script,ai,uploadartifact,downloadartifact
# The most tasks this dispatcher runs at once. A slot is held from the claim until the engine has
# taken the task's end report, a Pending pod and a retried end included, and each poll asks the
# engine for no more than the free slots. 0 means no cap.
flow.dispatcher.task.max-in-flight=25
# The worker image and command for the `ai` task type. An `ai` task declares no image or command of
# its own, so the dispatcher resolves both (executor/TaskImageResolver.java). The image ships from
# the boomerang-io/tasks repository (tasks/ai) like every other task image, so it is versioned
# independently of the product tag - there is no ${flow.version} to pin it to. The default is an
# exact version rather than :latest so a deployment runs a reproducible worker and an image
# published after this release cannot change how an ai task behaves; an operator overrides it to
# move deliberately.
flow.dispatcher.ai.image=boomerangio/task-ai:1.1.0
# The default worker image that runs the uploadartifact and downloadartifact tasks (its `artifact
# upload` / `artifact download` commands), released from boomerang-io/tasks (tasks/flow).
flow.dispatcher.artifact.image=boomerangio/task-flow:3.2.1
flow.dispatcher.name=flow-tekton-dispatcher
# Batched lease heartbeat: reports every TaskRun this dispatcher holds - running, or with its end
# report still being retried - so the engine renews their lease rather than reap a task that is
# merely slow. false sends none: a claim then never has a lease, and its task is requeued only
# when this dispatcher stops polling.
flow.dispatcher.lease.enabled=true
flow.dispatcher.lease.beat-ms=30000
# Workspace reconciliation: each tick lists the workspace PVCs this dispatcher holds and asks the
# engine which owners are finished, then deletes those claims. Nothing on the run records it.
flow.dispatcher.workspace.reconcile.enabled=true
flow.dispatcher.workspace.reconcile-ms=60000
# Task runtime TTL: runtime objects are removed kube.task.ttlDays days after completion regardless
# of kube.task.deletion - Jobs natively via ttlSecondsAfterFinished, Tekton TaskRuns via this
# reconciler (tekton executor only; each tick deletes this dispatcher's own finished TaskRuns that
# have outlived the TTL).
flow.dispatcher.task.reconcile.enabled=true
flow.dispatcher.task.reconcile-ms=3600000
# Bearer token sent to the engine on dispatcher calls, and nowhere else. Blank = send nothing. It
# must be a global Flow token with an actor kind (a machine token) minted via the token API.
flow.engine.dispatcher.token=
# Log4j Logging (io.boomerang.dispatcher includes the SDK, io.boomerang.dispatcher.sdk)
logging.level.io.boomerang.dispatcher=DEBUG
