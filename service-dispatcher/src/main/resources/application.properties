server.port=7702
spring.profiles.active=live
info.version=@version.name@
service.name=dispatcher
spring.application.name=${service.name}-${flow.environment}
spring.mvc.async.request-timeout=600000
flow.environment=
flow.instance=bmrg-flow
flow.product=bmrg-flow
flow.version=0.0.0
management.endpoints.web.base-path=/
management.health.elasticsearch.enabled=false
security.mode=none
proxy.enable=false
proxy.host=
proxy.port=
proxy.ignore=
springdoc.swagger-ui.path=/api/docs/swagger-ui
springdoc.api-docs.path=/api/docs/spec
springdoc.packages-to-scan=io.boomerang.controller
# General Config
# The namespace every task Job/TaskRun, PVC and ConfigMap is created in. Blank = the kubeconfig
# context's namespace, or the service-account namespace in-cluster.
kube.namespace=
kube.image.pullPolicy=IfNotPresent
kube.image.pullSecret=boomerang.registrykey
kube.timeout.waitUntil=30
# Backstop grace on the executor watch, added to the task's own budget. The engine owns the
# deadline and reaps first, so this only releases the thread when the watch never fires. Raise it
# where image pulls are slow.
kube.timeout.watchGraceMinutes=2
# How often the executor watch loop reconciles by listing the Job/TaskRun by label, on top of the
# watch event stream - catches a dropped watch connection or a missed event.
kube.timeout.reconcileSeconds=30
# The Job controller writes status.failed before it writes the Failed condition (and the reason,
# e.g. DeadlineExceeded), so kube-jobs's JobWatcher waits this long after first observing
# status.failed >= 1 with no condition yet, before falling back to a generic JobFailed.
kube.timeout.failedConditionGraceSeconds=60
# Workspace and Workflow Configuration
kube.workspace.storage.size=1Gi
kube.workspace.storage.class=
kube.workspace.storage.accessMode=ReadWriteMany
kube.workflow.storage.size=1Gi
kube.workflow.storage.class=
kube.workflow.storage.accessMode=ReadWriteMany
# Task configuration
kube.task.backOffLimit=0
kube.task.restartPolicy=Never
kube.task.ttlDays=7
kube.task.deletion=Never
kube.task.timeout=60
kube.task.storage.data.memory=false
dispatcher.tasks.hostaliases=[]
dispatcher.tasks.serviceaccount=
dispatcher.tasks.nodeselector={}
dispatcher.tasks.tolerations=[]
# Kubernetes RuntimeClass for Task Pods (kube-jobs executor only); blank leaves it unset.
dispatcher.tasks.runtimeClassName=
# Task execution runtime (TaskExecutor SPI): tekton | kube-jobs.
dispatcher.executor=tekton
# Logging
dispatcher.logging.type=default
dispatcher.logging.host=localhost
dispatcher.logging.port=9200
#dispatcher.logging.type=loki
#dispatcher.logging.host=loki.poc-loki.svc.cluster.local
#dispatcher.logging.port=3100
# typically we do 1/4 to 1/8 of the limit as the request
kube.resource.limit.ephemeral-storage=16Gi
kube.resource.request.ephemeral-storage=2Gi
kube.resource.limit.memory=16Gi
kube.resource.request.memory=2Gi
# Engine
flow.engine.service.host=localhost:7701
flow.engine.workflowrun.start.url=http://${flow.engine.service.host}/api/v1/dispatcher/workflowrun/{workflowRunId}/start
flow.engine.workflowrun.finalize.url=http://${flow.engine.service.host}/api/v1/dispatcher/workflowrun/{workflowRunId}/finalize
flow.engine.taskrun.start.url=http://${flow.engine.service.host}/api/v1/dispatcher/taskrun/{taskRunId}/start
flow.engine.taskrun.end.url=http://${flow.engine.service.host}/api/v1/dispatcher/taskrun/{taskRunId}/end
flow.engine.dispatcher.register.url=http://${flow.engine.service.host}/api/v1/dispatcher/register
flow.engine.dispatcher.workflowqueue.url=http://${flow.engine.service.host}/api/v1/dispatcher/{dispatcherId}/workflows
flow.engine.dispatcher.taskqueue.url=http://${flow.engine.service.host}/api/v1/dispatcher/{dispatcherId}/tasks
flow.engine.dispatcher.heartbeat.url=http://${flow.engine.service.host}/api/v1/dispatcher/{dispatcherId}/heartbeat
flow.dispatcher.task-types=template,custom,script
flow.dispatcher.name=flow-tekton-dispatcher
# Batched lease heartbeat: reports the TaskRun ids this dispatcher is still watching so the engine
# can renew their lease rather than reap a task that is merely slow.
flow.dispatcher.lease.enabled=true
flow.dispatcher.lease.beat-ms=30000
# Bearer token sent to the engine on dispatcher calls. Blank = send nothing. T6-1: this must now
# be a real Flow token (global scope, actorKind=SERVICE) minted via the token API - no dispatcher
# code change needed, the value it holds just changed from a shared secret to a minted token.
flow.engine.dispatcher.token=
# Log4j Logging
logging.level.io.boomerang.client=DEBUG
logging.level.io.boomerang.dispatcher=DEBUG
