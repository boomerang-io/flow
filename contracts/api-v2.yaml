info:
  description: "The public API. The rules every route follows: specifications/api-contract.md."
  title: "Boomerang Flow API"
  version: "2"
openapi: "3.1.0"
paths:
  /api/v2/activate:
    put:
      operationId: "register"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeCode"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: "boolean"
          description: "OK"
        "400":
          content:
            '*/*':
              schema:
                type: "boolean"
          description: "Bad Request"
      summary: "Register and activate an installation of Flow"
