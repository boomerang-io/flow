          type: "array"
      - description: "Resource types to filter for"
        example: "workflow"
        in: "query"
        name: "resourceType"
        required: false
        schema:
          items:
            type: "string"
          type: "array"
      - description: "A single resource id"
        in: "query"
        name: "resourceId"
        required: false
        schema:
          type: "string"
      - description: "Owning workspace ids to filter for"
        in: "query"
        name: "workspaceId"
        required: false
        schema:
          items:
            type: "string"
