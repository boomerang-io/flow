---
openapi: "3.1.0"
info:
  title: "Boomerang Flow dispatcher protocol"
  description: "What a dispatcher calls on the engine. Semantics and the compatibility\
    \ policy: specifications/dispatcher-contract.md."
  version: "1"
tags:
- name: "Dispatcher"
  description: "Manage Dispatcher operations. Register dispatcher. Check for WorkflowRuns\
    \ and TaskRuns"
paths:
  /dispatcher/v1/{id}/workflowrun/{workflowRunId}/provision-failed:
    put:
      tags:
      - "Dispatcher"
      summary: "Report that a claimed WorkflowRun's workspace could not be provisioned.\
        \ The reason shows on the run; the engine retries after a delay or, on the\
        \ last attempt, fails the run. A report for a run the dispatcher no longer\
        \ holds is ignored."
      operationId: "provisionFailed"
      parameters:
      - name: "id"
        in: "path"
        description: "Dispatcher ID"
        required: true
        schema:
          type: "string"
      - name: "workflowRunId"
        in: "path"
        description: "ID of the claimed WorkflowRun"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionFailureRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
  /dispatcher/v1/{id}/heartbeat:
    put:
      tags:
      - "Dispatcher"
      summary: "Renew the lease on the dispatcher's still-owned TaskRuns"
      operationId: "heartbeat"
      parameters:
      - name: "id"
        in: "path"
        description: "Dispatcher ID"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        "400":
          description: "Bad Request"
        "404":
          description: "The dispatcher id is not registered"
  /dispatcher/v1/workflowrun/{workflowRunId}/start:
    put:
      tags:
      - "Dispatcher"
      summary: "Start WorkflowRun execution. The WorkflowRun has to already have been\
        \ queued."
      operationId: "start"
      parameters:
      - name: "workflowRunId"
        in: "path"
        description: "ID of WorkflowRun to Start"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchWorkflowRun"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchWorkflowRun"
  /dispatcher/v1/taskrun/{taskRunId}/start:
    put:
      tags:
      - "Dispatcher"
      summary: "Start a Task Run. The Task Run has to already be queued."
      operationId: "startTaskRun"
      parameters:
      - name: "taskRunId"
        in: "path"
        description: "ID of Task Run to Start"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunStartRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchTaskRun"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchTaskRun"
  /dispatcher/v1/taskrun/{taskRunId}/log:
    put:
      tags:
      - "Dispatcher"
      summary: "Store the Task Run's finished log. Optional: send it before the end\
        \ so the log outlives the runtime; a dispatcher that serves logs at its registered\
        \ logsUrl may skip it."
      operationId: "storeTaskRunLog"
      parameters:
      - name: "taskRunId"
        in: "path"
        description: "ID of the Task Run"
        required: true
        schema:
          type: "string"
      - name: "dispatcherRef"
        in: "query"
        description: "The registered id of the dispatcher holding the claim"
        required: false
        schema:
          type: "string"
      requestBody:
        description: "The log, as text"
        content:
          text/plain:
            schema:
              type: "string"
        required: true
      responses:
        "204":
          description: "Stored"
        "409":
          description: "The claim is held by another dispatcher"
        "413":
          description: "The log is over flow.engine.task.log.max-bytes and was not\
            \ stored"
        "503":
          description: "No artifact store is configured"
  /dispatcher/v1/taskrun/{taskRunId}/end:
    put:
      tags:
      - "Dispatcher"
      summary: "End the Task Run."
      operationId: "endTaskRun"
      parameters:
      - name: "taskRunId"
        in: "path"
        description: "ID of Task Run to End"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunEndRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchTaskRun"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DispatchTaskRun"
  /dispatcher/v1/workspaces/releasable:
    post:
      tags:
      - "Dispatcher"
      summary: "Ask which of the runs a dispatcher holds a workspace volume for are\
        \ finished, so those volumes can be released."
      operationId: "releasableWorkspaces"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceReleaseQuery"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkspaceReleaseResponse"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WorkspaceReleaseResponse"
  /dispatcher/v1/register:
    post:
      tags:
      - "Dispatcher"
      summary: "Register a Dispatcher"
      operationId: "registerDispatcher"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatcherRegistrationRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "string"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "string"
  /dispatcher/v1/{id}/workflows:
    get:
      tags:
      - "Dispatcher"
      summary: "Retrieve a dispatcher's Workflows queue"
      operationId: "dispatcherWorkflowQueue"
      parameters:
      - name: "id"
        in: "path"
        description: "Dispatcher ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchWorkflowRun"
        "204":
          description: "No Items Found"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchWorkflowRun"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchWorkflowRun"
        "404":
          description: "The dispatcher id is not registered"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchWorkflowRun"
  /dispatcher/v1/{id}/tasks:
    get:
      tags:
      - "Dispatcher"
      summary: "Retrieve a dispatcher's Tasks queue"
      operationId: "dispatcherTasksQueue"
      parameters:
      - name: "id"
        in: "path"
        description: "Dispatcher ID"
        required: true
        schema:
          type: "string"
      - name: "limit"
        in: "query"
        description: "Most new TaskRuns to claim for execution (the dispatcher's free\
          \ slots), capped at a page of 20. 0 claims none and still returns termination\
          \ orders."
        required: false
        schema:
          type: "integer"
          format: "int32"
      - name: "type"
        in: "query"
        description: "Task types to claim, a subset of those registered; comma-separated,\
          \ `*` the only wildcard. Absent means every registered type."
        required: false
        schema:
          type: "string"
      - name: "task"
        in: "query"
        description: "Task slugs to claim; comma-separated, `*` the only wildcard."
        required: false
        schema:
          type: "string"
      - name: "workflowLabel"
        in: "query"
        description: "One label on the workflow definition, as key=value[,value];\
          \ `*` the only wildcard in the values."
        required: false
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchTaskRun"
        "204":
          description: "No Items Found"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchTaskRun"
        "400":
          description: "Bad Request"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchTaskRun"
        "404":
          description: "The dispatcher id is not registered"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DispatchTaskRun"
components:
  schemas:
    ProvisionFailureRequest:
      type: "object"
      properties:
        message:
          type: "string"
    HeartbeatRequest:
      type: "object"
      properties:
        ids:
          type: "array"
          items:
            type: "string"
    RunParam:
      type: "object"
      properties:
        name:
          type: "string"
        value: {}
        type:
          type: "string"
          enum:
          - "string"
          - "array"
          - "object"
          - "secret"
    WorkflowRunRequest:
      type: "object"
      properties:
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        annotations:
          type: "object"
          additionalProperties: {}
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/RunParam"
        workspace:
          $ref: "#/components/schemas/WorkflowWorkspace"
        timeout:
          type: "integer"
          format: "int64"
        retries:
          type: "integer"
          format: "int64"
        debug:
          type: "boolean"
    WorkflowWorkspace:
      type: "object"
      properties:
        size:
          type: "string"
        mountPath:
          type: "string"
        className:
          type: "string"
        accessMode:
          type: "string"
    DispatchWorkflowRun:
      type: "object"
      properties:
        id:
          type: "string"
        status:
          type: "string"
          enum:
          - "notstarted"
          - "ready"
          - "running"
          - "waiting"
          - "succeeded"
          - "failed"
          - "invalid"
          - "skipped"
          - "cancelled"
          - "timedout"
        phase:
          type: "string"
          enum:
          - "queued"
          - "pending"
          - "running"
          - "completed"
        workflowRef:
          type: "string"
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        workspace:
          $ref: "#/components/schemas/WorkflowWorkspace"
        statusReason:
          type: "string"
    TaskRunStartRequest:
      type: "object"
      properties:
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        annotations:
          type: "object"
          additionalProperties: {}
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/RunParam"
        timeout:
          type: "integer"
          format: "int64"
        preApproved:
          type: "boolean"
        dispatcherRef:
          type: "string"
    DispatchTaskRun:
      type: "object"
      properties:
        id:
          type: "string"
        type:
          type: "string"
          enum:
          - "start"
          - "end"
          - "template"
          - "custom"
          - "generic"
          - "decision"
          - "approval"
          - "setwfproperty"
          - "manual"
          - "eventwait"
          - "acquirelock"
          - "releaselock"
          - "runworkflow"
          - "runscheduledworkflow"
          - "script"
          - "ai"
          - "setwfstatus"
          - "sleep"
          - "uploadartifact"
          - "downloadartifact"
        name:
          type: "string"
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        timeout:
          type: "integer"
          format: "int64"
        params:
          type: "array"
          items:
            $ref: "#/components/schemas/RunParam"
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/RunResult"
        workspace:
          $ref: "#/components/schemas/WorkflowWorkspace"
        spec:
          $ref: "#/components/schemas/TaskRunSpec"
        status:
          type: "string"
          enum:
          - "notstarted"
          - "ready"
          - "running"
          - "waiting"
          - "succeeded"
          - "failed"
          - "invalid"
          - "skipped"
          - "cancelled"
          - "timedout"
        phase:
          type: "string"
          enum:
          - "queued"
          - "pending"
          - "running"
          - "completed"
        taskRef:
          type: "string"
        workflowRef:
          type: "string"
        workflowRunRef:
          type: "string"
        index:
          type: "integer"
          format: "int32"
        statusReason:
          type: "string"
        attempt:
          type: "integer"
          format: "int32"
        attempts:
          type: "array"
          items:
            $ref: "#/components/schemas/RunAttempt"
        retry:
          $ref: "#/components/schemas/TaskRunRetry"
    RunAttempt:
      type: "object"
      properties:
        number:
          type: "integer"
          format: "int32"
        claimedAt:
          type: "string"
          format: "date-time"
        endedAt:
          type: "string"
          format: "date-time"
        duration:
          type: "integer"
          format: "int64"
        status:
          type: "string"
          enum:
          - "notstarted"
          - "ready"
          - "running"
          - "waiting"
          - "succeeded"
          - "failed"
          - "invalid"
          - "skipped"
          - "cancelled"
          - "timedout"
        statusReason:
          type: "string"
        statusMessage:
          type: "string"
        dispatcherRef:
          type: "string"
    RunResult:
      type: "object"
      properties:
        name:
          type: "string"
        description:
          type: "string"
        value: {}
    TaskEnvVar:
      type: "object"
      properties:
        name:
          type: "string"
        value:
          type: "string"
    TaskRunRetry:
      type: "object"
      properties:
        max:
          type: "integer"
          format: "int32"
        failures:
          type: "integer"
          format: "int32"
    TaskRunSpec:
      type: "object"
      properties:
        arguments:
          type: "array"
          items:
            type: "string"
        command:
          type: "array"
          items:
            type: "string"
        envs:
          type: "array"
          items:
            $ref: "#/components/schemas/TaskEnvVar"
        image:
          type: "string"
        script:
          type: "string"
        workingDir:
          type: "string"
        debug:
          type: "boolean"
        timeout:
          type: "integer"
          format: "int32"
        deletion:
          type: "string"
          enum:
          - "Never"
          - "OnSuccess"
          - "Always"
    TaskRunEndRequest:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
          - "notstarted"
          - "ready"
          - "running"
          - "waiting"
          - "succeeded"
          - "failed"
          - "invalid"
          - "skipped"
          - "cancelled"
          - "timedout"
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        annotations:
          type: "object"
          additionalProperties: {}
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/RunResult"
        statusMessage:
          type: "string"
        statusReason:
          type: "string"
        retryable:
          type: "boolean"
        dispatcherRef:
          type: "string"
    WorkspaceReleaseQuery:
      type: "object"
      properties:
        workflowRunRefs:
          type: "array"
          items:
            type: "string"
    WorkspaceReleaseResponse:
      type: "object"
      properties:
        workflowRunRefs:
          type: "array"
          items:
            type: "string"
    DispatcherRegistrationRequest:
      type: "object"
      properties:
        name:
          type: "string"
        version:
          type: "integer"
          format: "int32"
        host:
          type: "string"
        workflowAnnotations:
          type: "array"
          items:
            type: "string"
        taskAnnotations:
          type: "array"
          items:
            type: "string"
        taskTypes:
          type: "array"
          items:
            type: "string"
        logsUrl:
          type: "string"
        logsToken:
          type: "string"
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    x-access-token:
      type: "apiKey"
      name: "x-access-token"
      in: "header"
