server.port=7700
spring.profiles.active=live
service.name=Workflow
flow.environment=
flow.version=
spring.application.name=${service.name}-${flow.environment}
#temporary workaround, until the circualr dependencies are removed
spring.main.allow-circular-references=true
spring.autoconfigure.exclude[0]=org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
# Flow Mode (H6, re-ruled 2026-08-15): standalone | engine. standalone is the complete
# self-contained product (workspaces, auth, integrations, schedules - everything); engine is the
# embedded headless execution subset. Gates which module roots load (io.boomerang.integrations,
# workspace, schedule today). Missing/blank = standalone.
flow.mode=standalone
# Security
# flow.security.enabled (A5) is the single switch for both security halves (authentication filter
# chain + authorization interceptor); its default derives from flow.mode (standalone=true,
# engine=false). Leave it unset to take the mode-derived default - the product (standalone) boots
# secured by default.
# flow.security.enabled=
flow.workflowrun.auto-start-on-submit=false
flow.token.max-user-session-duration=24
# T6-1: /api/v1/dispatcher/** requires a real Flow token (global scope + a machine actorKind -
# see TokenActorKind/DispatcherAuthFilter). Set false only for local dev/test to disable
# enforcement entirely. Replaces the interim flow.dispatcher.token shared secret (E8.2a).
flow.dispatcher.auth.enabled=true
# Error Management
flow.error.include-cause=false
# Merged from service-engine (E8.2a) - engine feature flags
flow.events.sink.enabled=false
flow.events.sink.urls=
# Kill switch: stops agent queue claiming only; recovery sweeps are never gated.
flow.queue.enabled=true
flow.audit.enabled=false
flow.uniquenames.enabled=false
# MongoDB connection information
spring.mongodb.uri=mongodb://boomerang:VLLbE1nbpl@localhost:27019/boomerang?connectTimeoutMS=10000&socketTimeoutMS=120000
# JAVA_LEGACY matches the pre-Boot-4 driver default so existing stored UUIDs keep resolving
spring.mongodb.representation.uuid=java-legacy
# Async request timeout must cover the agent's 600s log stream (Tomcat default is 30s)
spring.mvc.async.request-timeout=600000
spring.data.mongodb.repositories.type=auto
# T6-2: the loader (service-loader) is the sole index authority - annotation-driven creation at
# boot is an ARCHIE-flagged latent risk (indexes silently depend on which replica boots first /
# whether the entity module was even loaded). No @Indexed/@CompoundIndex in this codebase is
# unique or TTL, so disabling this does not remove any correctness guarantee - only indexes that
# the loader does not (yet) mirror lose their query-performance assist until covered there.
spring.data.mongodb.auto-index-creation=false
management.health.mongodb.enabled=false
flow.mongo.collection.prefix=flow
# Virtual threads for request handling: the agent long-poll parks one request thread per
# connected agent for the poll window, so platform threads cap concurrent agents at the pool
# size. The claim path is measured not to pin virtual threads (see AgentPollerVirtualThreadTest),
# so parked pollers cost a cheap virtual thread and the agent count is no longer thread-bound.
# (Merged from service-engine, E8.2a)
spring.threads.virtual.enabled=true
# HTTP Header Config (merged from service-engine, E8.2a)
server.max-http-request-header-size=80KB
# Customising path of Health probe for kubernetes to be /health (merged from service-engine, E8.2a)
management.endpoint.health.probes.enabled=true
# Tekton Handler Service Integration
flow.agent.service.host=localhost:7702
flow.agent.streamlogs.url=http://${flow.agent.service.host}/api/v1/log/stream
# Merged from service-engine (E8.2a) - used by engine's LogClient
flow.agent.logstream.url=http://${flow.agent.service.host}/api/v1/logs/stream
# Engine Service Integration
# E8.2b: EngineClient now calls the merged engine services in-process (DD-02) - the flow->engine
# HTTP transport and its flow.engine.*.url properties are gone. P3c1: the engine->flow callback
# direction (WorkflowClient/InternalController) is also gone, replaced by in-process
# ApplicationEvents (ScheduleRequested, ChildWorkflowRunCreated).
# Workflow Service Integration
flow.services.workflow.host=localhost:7700
flow.workflow.event.url=${flow.services.workflow.host}/api/v2/event
flow.workflow.webhook.url=${flow.services.workflow.host}/api/v2/webhook
flow.workflow.wfe.url=${flow.services.workflow.host}/api/v2/wfe
# Distributed tracing (Micrometer Tracing + OTel/OTLP). To enable, set to true and point
# management.opentelemetry.tracing.export.otlp.endpoint at an OTLP collector.
management.tracing.export.enabled=false
# Workflow Mode Settings
users.base.url=
flow.externalUrl.platformNavigation=${users.base.url}/users/navigation
flow.externalUrl.user=
flow.externalUrl.team=
flow.externalUrl.navigation=
# Platform features
core.feature.notifications.enable=true
core.feature.docs.enable=true
core.feature.support.enable=true
core.platform.name=Boomerang
core.platform.version=1.0.0
core.platform.baseEnvUrl=http://localhost
flow.baseUrl==http://localhost
flow.signOutUrl=https://w3id.sso.ibm.com/pkmslogout
core.platform.environment=
