server.port=7700
spring.profiles.active=live
service.name=Workflow
flow.environment=
flow.version=
spring.application.name=${service.name}-${flow.environment}
#temporary workaround, until the circualr dependencies are removed
spring.main.allow-circular-references=true
spring.autoconfigure.exclude[0]=org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
# Deployment shape. Every bean loads in every deployment; these properties express the shape.
# flow.security.enabled is the single switch for both security halves (authentication filter
# chain + endpoint authorization). Default true; with it false every request runs as a synthetic
# admin (UnauthenticatedGlobalToken) - set it only for a headless embedded engine or local dev.
flow.security.enabled=true
# flow.workspace.single serves the seeded `system` workspace alone: any other {workspace} path
# segment is refused (SingleWorkspaceInterceptor) and workspaces cannot be created or deleted.
# An embedding product sets it together with flow.security.enabled=false.
flow.workspace.single=false
# flow.security.bootstrap-token is a secured install's first credential when no person will sign
# in: a bfg_ token of at least 32 further characters, registered at startup as a global service
# token (BootstrapTokenService). Supply it as a secret; rotate it by changing the value and
# restarting. It is registered whether or not security is on; blank registers nothing.
flow.security.bootstrap-token=
# Per-instance cache of validated bearer tokens keyed by hash (TokenLookupCache): one Mongo read per
# token per TTL; revoke evicts locally only, so another instance may honour a revoked token for up to ttl.
flow.security.token-cache.enabled=true
flow.security.token-cache.ttl=60s
flow.security.token-cache.max-size=10000
# Per-instance cache of the global, workspace and context parameter layers and of revisions
# (ParamLayerCache): tasks admitted within the TTL share one read of each store. A write clears it on
# the writing instance; another instance sees the write within ttl. ttl=0s turns it off.
flow.parameters.layer-cache.enabled=true
flow.parameters.layer-cache.ttl=10s
flow.parameters.layer-cache.max-size=1000
# Webhook and CloudEvent triggers start the runs they submit (decision 0069: submit means run;
# a run with workspaces still waits for dispatcher provisioning). Set false to park
# trigger-created runs for an external PUT /workflowrun/{id}/start.
flow.workflowrun.auto-start-on-submit=true
flow.token.max-user-session-duration=24
# T6-1: /dispatcher/** requires a real Flow token (global scope + a machine actorKind -
# see TokenActorKind/DispatcherAuthFilter). Set false only for local dev/test to disable
# enforcement entirely. Replaces the interim flow.dispatcher.token shared secret (E8.2a).
flow.dispatcher.auth.enabled=true
# Lease length granted per heartbeat (ms). MUST stay >= 2x the dispatcher beat interval (30s)
# plus a sweep interval - 90s is the floor - so a healthy dispatcher's lease never lapses
# between two consecutive heartbeats.
flow.dispatcher.lease-ms=90000
# Error Management
flow.error.include-cause=false
# Merged from service-engine (E8.2a) - engine feature flags
flow.events.sink.enabled=false
# Sinks as bare URLs (comma separated). Any secret has to ride in the query string
# (...?token=xyz), where every proxy and access log records it - prefer the header form below.
flow.events.sink.urls=
# Sinks that authenticate with a request header instead. header-name defaults to Authorization;
# header-value is a secret and MUST come from the environment, never a checked-in value:
# flow.events.sink.destinations[0].url=https://receiver.example.com/events
# flow.events.sink.destinations[0].header-name=Authorization
# flow.events.sink.destinations[0].header-value=${FLOW_EVENTS_SINK_TOKEN}
# How much of the run a status CloudEvent carries: thin (default) is identity and lifecycle only -
# id, refs, status, statusReason, phase, labels, creationDate, startTime, duration - and a consumer
# reads the run back over the API for params and results; full carries the whole public run model.
flow.events.sink.payload=thin
# Kill switch: stops agent queue claiming only; recovery sweeps are never gated.
flow.queue.enabled=true
# MongoDB connection information
spring.mongodb.uri=mongodb://boomerang:VLLbE1nbpl@localhost:27019/boomerang?connectTimeoutMS=10000&socketTimeoutMS=120000
# JAVA_LEGACY matches the pre-Boot-4 driver default so existing stored UUIDs keep resolving
spring.mongodb.representation.uuid=java-legacy
# Async request timeout must cover the agent's 600s log stream (Tomcat default is 30s)
spring.mvc.async.request-timeout=600000
spring.data.mongodb.repositories.type=auto
# The change units in io.boomerang.migration are the sole index authority; entity annotations
# stay inert so no index depends on which replica boots first.
spring.data.mongodb.auto-index-creation=false
management.health.mongodb.enabled=false
flow.mongo.collection.prefix=flow
# Change units run while the context starts, before the web server and the scheduled sweeps; a
# failed unit fails startup and is retried on the next start. Replicas starting together wait on
# the lock for up to 30 minutes (a large v3 upgrade outlasts Flamingock's 3-minute default), then
# skip what another replica applied. flamingock.enabled=false turns migrations off.
flamingock.management-mode=INITIALIZING_BEAN
flamingock.lock-quit-trying-after-millis=1800000
# Virtual threads for request handling: the agent long-poll parks one request thread per
# connected agent for the poll window, so platform threads cap concurrent agents at the pool
# size. The claim path is measured not to pin virtual threads (see AgentPollerVirtualThreadTest),
# so parked pollers cost a cheap virtual thread and the agent count is no longer thread-bound.
# (Merged from service-engine, E8.2a)
spring.threads.virtual.enabled=true
# HTTP Header Config (merged from service-engine, E8.2a)
server.max-http-request-header-size=80KB
# Customising path of Health probe for kubernetes to be /health (merged from service-engine, E8.2a)
management.endpoint.health.probes.enabled=true
# Task logs. A task's stored log, when its dispatcher uploaded one, is served first. Otherwise the
# engine reads the live log from the dispatcher holding the claim, at the logsUrl it registered and
# with the token it registered; nothing on core names a dispatcher (engine/LogClient.java).
# The most bytes of a finished log a dispatcher may store for a task
# (PUT /dispatcher/v1/taskrun/{id}/log); a larger one is refused whole, never truncated.
flow.engine.task.log.max-bytes=10485760
# Engine Service Integration
# E8.2b: EngineClient now calls the merged engine services in-process (DD-02) - the flow->engine
# HTTP transport and its flow.engine.*.url properties are gone. P3c1: the engine->flow callback
# direction (WorkflowClient/InternalController) is also gone, replaced by in-process
# ApplicationEvents (ScheduleRequested, ChildWorkflowRunCreated).
# Workflow Service Integration
flow.services.workflow.host=localhost:7700
flow.workflow.event.url=${flow.services.workflow.host}/api/v2/event
flow.workflow.webhook.url=${flow.services.workflow.host}/api/v2/webhook
flow.workflow.wfe.url=${flow.services.workflow.host}/api/v2/wfe
# Distributed tracing (Micrometer Tracing + OTel/OTLP). To enable, set to true and point
# management.opentelemetry.tracing.export.otlp.endpoint at an OTLP collector.
management.tracing.export.enabled=false
# Workflow Mode Settings
users.base.url=
flow.externalUrl.platformNavigation=${users.base.url}/users/navigation
flow.externalUrl.user=
flow.externalUrl.team=
flow.externalUrl.navigation=
# Platform features
core.feature.notifications.enable=true
core.feature.docs.enable=true
core.feature.support.enable=true
core.platform.name=Boomerang
core.platform.version=1.0.0
core.platform.baseEnvUrl=http://localhost
flow.baseUrl=
flow.signOutUrl=
core.platform.environment=
# Flow One Time setup
FLOW_OTC=test
flow.otc=${FLOW_OTC}
# Encryption of secured settings (AES-GCM). flow.encrypt.* is the key every install must set; a
# blank pair refuses startup. mongo.encrypt.* is the pair a v3 install encrypted with, read once by
# the migration that re-encrypts those values. Both default to FLOW_ENCRYPT_SECRET/FLOW_ENCRYPT_SALT,
# the variables v3's chart generated and kept in its Secret, so a v3 install upgrades with that Secret
# unchanged. MONGO_ENCRYPT_SECRET/MONGO_ENCRYPT_SALT override the v3 pair on its own.
flow.encrypt.secret=${FLOW_ENCRYPT_SECRET:}
flow.encrypt.salt=${FLOW_ENCRYPT_SALT:}
mongo.encrypt.secret=${FLOW_ENCRYPT_SECRET:}
mongo.encrypt.salt=${FLOW_ENCRYPT_SALT:}
# A v3 settings value that does not decrypt under mongo.encrypt.* stops the upgrade; true blanks each
# such value instead, logged by setting, to be entered again in Settings.
flow.migration.reset-unreadable-settings=false
# Flow Default Quotas
max.workflow.duration=300
max.workflow.count=10
max.workflow.execution.monthly=100
max.workflow.execution.time=30
max.concurrent.workflows=4
# Proxy Settings
proxy.host=
proxy.port=
# Flow App Settings
flow.apps.url=/apps/flow
flow.apps.flow.url=/apps/flow
# Swagger Settings
springdoc.swagger-ui.path=/api/docs/swagger-ui
springdoc.api-docs.path=/api/docs/spec
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.showExtensions=true
springdoc.packages-to-scan=io.boomerang
# /internal/** is called by the webapp's server only and is not part of the published API.
springdoc.paths-to-exclude=/internal/**
springdoc.swagger-ui.enabled=true
# Spring Logging. io.boomerang.* runs at INFO; DEBUG is opt-in (logging.level.io.boomerang.engine=DEBUG).
# No level prints a parameter value: logs carry names, and a secret's toString is masked.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.security=WARN
logging.level.io.boomerang.core=INFO
logging.level.io.boomerang.scheduler=INFO
logging.level.io.boomerang.security=INFO
logging.level.io.boomerang.integrations=INFO
logging.level.io.boomerang.workflow=INFO
# Merged from service-engine (E8.2a)
logging.level.io.boomerang.engine=INFO
# Misc Spring Configuration
spring.aop.proxy-target-class=true
management.endpoints.web.base-path=/
# JobRunr Config

# Engine-enforced payload caps (bytes, serialized JSON): resolved TaskRun params are checked at
# admission (oversize = the task is invalidated before it is ever claimable) and TaskRun results at
# end (oversize = the task fails, results are not persisted). Large values pass by reference: a
# workspace path or a URI. The results check is a storage guard against a faulty dispatcher, not an
# executor limit - each dispatcher enforces its own (Kubernetes' 4096-byte termination message).
flow.engine.task.params.max-bytes=16384
flow.engine.task.results.max-bytes=1048576

# Artifacts: files upload tasks attach to a run, kept in an S3-compatible store (AWS S3, MinIO,
# Cloud Storage's S3 mode). Off until enabled; every artifact call then answers
# ARTIFACTS_NOT_CONFIGURED. Retention, the largest artifact and the storage quota are admin settings
# (Settings > Artifacts, Quotas), not properties. link-endpoint is the store address that
# task pods reach when it differs from service-core's (e.g. host.docker.internal under OrbStack).
flow.artifacts.enabled=false
flow.artifacts.store.endpoint=
flow.artifacts.store.link-endpoint=
flow.artifacts.store.region=us-east-1
flow.artifacts.store.bucket=flow-artifacts
flow.artifacts.store.access-key=
flow.artifacts.store.secret-key=
flow.artifacts.store.path-style=true
flow.artifacts.link-ttl-minutes=15
flow.artifacts.upload-grace-minutes=60
