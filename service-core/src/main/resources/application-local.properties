server.port=8081
# MongoDB connection information
spring.mongodb.uri=mongodb://localhost:27017/boomerang
flow.mongo.collection.prefix=backstop
# Error Management
flow.error.include-cause=true
# Core Services Integration
core.users.service.host=localhost:8084
# Engine Integration
# E8.2b: EngineClient calls the merged engine services in-process (DD-02) - no more
# flow.engine.service.host. flow.workflow.service.host is the remaining engine->flow callback
# direction (WorkflowClient), still HTTP until that inversion happens.
flow.workflow.service.host=localhost:8081
# Security
flow.auth.enabled=true
# Core Services Integration
core.authorization.basic.password=coronet-cottage-nave-idiom-resume
# Merged from service-engine (E8.2a)
flow.events.sink.enabled=false
flow.events.sink.urls=
flow.audit.enabled=true
# Unused/legacy - carried over from service-engine's local properties
flow.refs.useId=false
# Spring Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.io.boomerang.workflow=DEBUG
logging.level.io.boomerang.core=DEBUG
logging.level.io.boomerang.scheduler=DEBUG
logging.level.io.boomerang.security=DEBUG
logging.level.io.boomerang.audit=DEBUG
logging.level.io.boomerang.engine=DEBUG
# External User Service
flow.externalUrl.platformNavigation=
