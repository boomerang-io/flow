# service-core on the host against the compose stack (docker-compose.yml: Mongo, IDPZero, SeaweedFS
# and the dispatcher in Docker). The same values the `stack` profile gives the container, with host
# addresses. Run with:
#
#   mvn -pl service-core -am spring-boot:run -Dspring-boot.run.profiles=local
#
# Browser-facing origin is client-web's own server (client-web/README.md), not this port.
spring.mongodb.uri=mongodb://localhost:27017/boomerang
flow.mongo.collection.prefix=flow
flow.mode=standalone
flow.security.enabled=true
flow.error.include-cause=true

# The key secured settings are encrypted with; required on every install. Local-only values,
# the same ones the compose stack uses, so one database works for both.
flow.encrypt.secret=flow-local-encrypt-secret
flow.encrypt.salt=flow-local-encrypt-salt

# Run artifacts go to the stack's SeaweedFS on its published port. The links are signed for the
# host name the laptop cluster's task pods resolve, not localhost.
flow.artifacts.enabled=true
flow.artifacts.store.endpoint=http://localhost:8333
flow.artifacts.store.link-endpoint=http://host.docker.internal:8333
flow.artifacts.store.bucket=flow-artifacts
flow.artifacts.store.access-key=flow-local
flow.artifacts.store.secret-key=flow-local-secret

# The dispatcher container registers without a token (the documented dev/test escape hatch; never
# in a real deployment), and task logs stream from its published port.
flow.dispatcher.auth.enabled=false
flow.agent.service.host=localhost:7702

logging.level.io.boomerang=INFO
