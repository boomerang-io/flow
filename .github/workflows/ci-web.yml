name: CI Web
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch) or pull request events
  push:
    branches:
      - main
    paths:
      - 'client-web/**'
      - '.github/workflows/ci-web.yml'
  pull_request:
    paths:
      - 'client-web/**'
      - '.github/workflows/ci-web.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every job gates: a failing spec, a type error, a raw hex colour outside
  # src/Styles/_variables.scss (stylelint.config.mjs) or a broken build fails the workflow.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client-web/package.json
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: client-web/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: client-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: client-web
        run: pnpm install
      - name: Test
        working-directory: client-web
        run: pnpm test
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client-web/package.json
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: client-web/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: client-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: client-web
        run: pnpm install
      - name: Typecheck
        working-directory: client-web
        run: pnpm run typecheck
      - name: Lint stylesheets
        working-directory: client-web
        run: pnpm run lint:style
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client-web/package.json
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: client-web/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: client-web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: client-web
        run: pnpm install
      - name: Build
        working-directory: client-web
        run: pnpm run build
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
# Release/deploy (Docker build + push) lives in ci-release.yml, triggered by the
# product tag (`x.y.z`, optional `-beta.N`/`-rc.N`). This workflow only tests and builds the app.
