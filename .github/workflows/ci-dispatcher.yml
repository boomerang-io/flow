name: CI Dispatcher
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch and tag) or pull request events
  # The dispatcher is built on dispatcher-sdk, whose contract test reads contracts/.
  push:
    branches:
      - main
    paths:
      - 'service-dispatcher/**'
      - 'dispatcher-sdk/**'
      - 'contracts/**'
      - 'service-core/src/main/java/io/boomerang/common/model/StatusReason.java'
      - 'pom.xml'
      - '.github/workflows/ci-dispatcher.yml'
  pull_request:
    paths:
      - 'service-dispatcher/**'
      - 'dispatcher-sdk/**'
      - 'contracts/**'
      - 'service-core/src/main/java/io/boomerang/common/model/StatusReason.java'
      - 'pom.xml'
      - '.github/workflows/ci-dispatcher.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Package
        run: |
          mvn clean test --projects service-dispatcher --also-make --batch-mode
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
  image:
    runs-on: ubuntu-latest
    # The image is the build: service-dispatcher/Dockerfile runs Maven in its build stage from the
    # checkout. Built here and never pushed; ci-release.yml pushes on a product tag. The layer cache
    # is GitHub's, one scope per image, shared with ci-release.yml.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-dispatcher/Dockerfile
          push: false
          cache-from: type=gha,scope=flow-service-dispatcher
          cache-to: type=gha,mode=max,scope=flow-service-dispatcher
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
# Release (multi-platform image build and push) lives in ci-release.yml, triggered by the product tag
# (`5.x.y`, optional `-beta.N`/`-rc.N`). This workflow tests the module and proves its image builds.
