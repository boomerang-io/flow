name: CI Release
on:
  # Allows you to run this workflow manually from the Actions tab (builds every image but skips
  # the Docker push — see the `startsWith(github.ref, 'refs/tags/')` guards below).
  workflow_dispatch:
  # One product tag builds the whole compatible image set: v5 is a single-image,
  # single-version-line release — no more per-service tags.
  push:
    tags:
      - '5.[0-9]+.[0-9]+'
      - '5.[0-9]+.[0-9]+-beta.[0-9]+'
      - '5.[0-9]+.[0-9]+-rc.[0-9]+'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every image is a multi-stage build from the checkout (the Java Dockerfiles run Maven in a build
  # stage on the builder's platform; client-web's runs pnpm), so there is no jar build or artifact
  # handoff: the image build is the build. A manual run builds each image under a local-only
  # `dev-<sha>` tag and pushes nothing; a product tag logs in and pushes. Tests run in the
  # path-filtered ci-core, ci-dispatcher and ci-web workflows. One matrix job builds the three
  # images; each leg keeps its own check name (deploy-core, deploy-dispatcher, deploy-webapp) and
  # one failing leg does not cancel the others.
  deploy:
    name: deploy-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One image serves every deployment shape (flow.security.enabled, flow.workspace.single
          # are set at deploy time). No separate engine image or tag.
          - name: core
            repo: flow-service-core
            context: .
            file: service-core/Dockerfile
          - name: dispatcher
            repo: flow-service-dispatcher
            context: .
            file: service-dispatcher/Dockerfile
          - name: webapp
            repo: flow-client-web
            context: client-web
            file: client-web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        env:
          IMAGE: boomerangio/${{ matrix.repo }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          TAGS="${IMAGE}:${VERSION}"
          case "$VERSION" in
            dev-*|*-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},${IMAGE}:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.get_version.outputs.TAGS }}
          # service-core reports it as flow.version; the other two images ignore it.
          build-args: FLOW_VERSION=${{ steps.get_version.outputs.VERSION }}
          # GitHub's layer cache, one scope per image, shared with the image builds in ci-e2e.yml
          # and ci-dispatcher.yml (a tag reads what main wrote).
          cache-from: type=gha,scope=${{ matrix.repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repo }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          job-name: deploy-${{ matrix.name }}
  publish-sdk:
    runs-on: ubuntu-latest
    # The two libraries, the dispatcher SDK and the Flow SDK, are published to this repository's
    # GitHub Packages Maven registry, each versioned by the product tag: a library's version is the
    # server version it was built against. A manual run publishes nothing.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [dispatcher-sdk, flow-sdk]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # distributionManagement/repository/id in each library's pom.xml
          settings-path: ${{ github.workspace }}
      - name: Set the library's version from the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mvn --batch-mode -f ${{ matrix.module }}/pom.xml org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn --batch-mode -f ${{ matrix.module }}/pom.xml -P release deploy -s settings.xml
      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
