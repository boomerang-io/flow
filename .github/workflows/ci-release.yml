name: CI Release
on:
  # Allows you to run this workflow manually from the Actions tab (builds the jars +
  # images but skips the Docker push — see the `startsWith(github.ref, 'refs/tags/')`
  # guards below).
  workflow_dispatch:
  # One product tag builds the whole compatible image set (DD-03 / AM-9): v5 is a
  # single-image, single-version-line release — no more per-service tags.
  push:
    tags:
      - '5.[0-9]+.[0-9]+'
      - '5.[0-9]+.[0-9]+-beta.[0-9]+'
      - '5.[0-9]+.[0-9]+-rc.[0-9]+'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Maven Package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean package --projects service-core --also-make --batch-mode -Dmaven.test.skip=true -s settings.xml
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: service-core.jar
          path: service-core/target/service-core.jar
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-core:
    runs-on: ubuntu-latest
    needs: build-core
    # One image serves both `full` and `engine` mode (flow.mode=engine at deploy time) —
    # DD-02/DD-05. No separate engine image/tag.
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-core.jar
          path: ${{ github.workspace }}/target
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          TAGS="boomerangio/flow-service-core:${VERSION}"
          case "$VERSION" in
            *-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-service-core:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-core/Dockerfile
          push: true
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  build-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}
      - name: Maven Package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn clean package --projects service-dispatcher --also-make --batch-mode -Dmaven.test.skip=true -s settings.xml
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: service-dispatcher.jar
          path: service-dispatcher/target/service-dispatcher.jar
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-agent:
    runs-on: ubuntu-latest
    needs: build-dispatcher
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-dispatcher.jar
          path: ${{ github.workspace }}/target
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          TAGS="boomerangio/flow-service-dispatcher:${VERSION}"
          case "$VERSION" in
            *-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-service-dispatcher:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-dispatcher/Dockerfile
          push: true
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  build-loader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Package
        run: mvn clean package --projects service-loader --batch-mode -Dmaven.test.skip=true
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: service-loader.jar
          path: service-loader/target/service-loader.jar
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-loader:
    runs-on: ubuntu-latest
    needs: build-loader
    # The loader is run as a pre-deploy Job (DD-07) — same product tag, same image set.
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-loader.jar
          path: ${{ github.workspace }}/target
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          TAGS="boomerangio/flow-service-loader:${VERSION}"
          case "$VERSION" in
            *-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-service-loader:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-loader/Dockerfile
          push: true
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-webapp:
    runs-on: ubuntu-latest
    # No build job or artifact: client-web/Dockerfile is a multi-stage build that runs
    # `pnpm install --frozen-lockfile && pnpm run build` itself, so the image builds from a clean
    # checkout. A manual run still builds the image (like the jar jobs above build their jars)
    # and only a product tag logs in and pushes. Pull-request builds and tests of the webapp
    # live in ci-web.yml.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        # A manual (non-tag) run gets a local-only `dev-<sha>` tag; it is never pushed.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          TAGS="boomerangio/flow-client-web:${VERSION}"
          case "$VERSION" in
            dev-*|*-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-client-web:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: client-web
          file: client-web/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
