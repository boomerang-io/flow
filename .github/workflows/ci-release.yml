name: CI Release
on:
  # Allows you to run this workflow manually from the Actions tab (builds every image but skips
  # the Docker push — see the `startsWith(github.ref, 'refs/tags/')` guards below).
  workflow_dispatch:
  # One product tag builds the whole compatible image set: v5 is a single-image,
  # single-version-line release — no more per-service tags.
  push:
    tags:
      - '5.[0-9]+.[0-9]+'
      - '5.[0-9]+.[0-9]+-beta.[0-9]+'
      - '5.[0-9]+.[0-9]+-rc.[0-9]+'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every image is a multi-stage build from the checkout (the Java Dockerfiles run Maven in a build
  # stage on the builder's platform; client-web's runs pnpm), so there is no jar build or artifact
  # handoff: the image build is the build. A manual run builds each image under a local-only
  # `dev-<sha>` tag and pushes nothing; a product tag logs in and pushes. Tests run in the
  # path-filtered ci-core, ci-dispatcher and ci-web workflows.
  deploy-core:
    runs-on: ubuntu-latest
    # One image serves every deployment shape (flow.security.enabled, flow.workspace.single are
    # set at deploy time). No separate engine image or tag.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          TAGS="boomerangio/flow-service-core:${VERSION}"
          case "$VERSION" in
            dev-*|*-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-service-core:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          TAGS="boomerangio/flow-service-dispatcher:${VERSION}"
          case "$VERSION" in
            dev-*|*-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-service-dispatcher:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-dispatcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  publish-sdk:
    runs-on: ubuntu-latest
    # The dispatcher SDK is the only library published: to this repository's GitHub Packages Maven
    # registry, versioned by the product tag. A manual run publishes nothing.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # distributionManagement/repository/id in dispatcher-sdk/pom.xml
          settings-path: ${{ github.workspace }}
      - name: Set the SDK version from the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mvn --batch-mode -f dispatcher-sdk/pom.xml org.codehaus.mojo:versions-maven-plugin:2.21.0:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mvn --batch-mode -f dispatcher-sdk/pom.xml -P release deploy -s settings.xml
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  deploy-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute image tags
        id: get_version
        # :latest tracks the newest stable release only — a beta/rc tag must not repoint it.
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) VERSION=${GITHUB_REF#refs/tags/} ;;
            *) VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          TAGS="boomerangio/flow-client-web:${VERSION}"
          case "$VERSION" in
            dev-*|*-beta.*|*-rc.*) ;;
            *) TAGS="${TAGS},boomerangio/flow-client-web:latest" ;;
          esac
          echo "TAGS=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: client-web
          file: client-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.get_version.outputs.TAGS }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
