name: CI Core
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch and tag) or pull request events
  push:
    branches:
      - main
    paths:
      - 'service-core/**'
      - 'lib-common/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    paths:
      - 'service-core/**'
      - 'lib-common/**'
      - '.github/workflows/ci-core.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java and Maven
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: Maven Package
        env:
          GITHUB_TOKEN: ${{ github.token }} # GITHUB_TOKEN is the default env for the password
        run: |
          mvn clean test --projects service-core --also-make --batch-mode -s settings.xml
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  image:
    runs-on: ubuntu-latest
    # The image is the build: service-core/Dockerfile runs Maven in its build stage from the
    # checkout. Built here and never pushed; ci-release.yml pushes on a product tag.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-core/Dockerfile
          push: false
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
# Release (multi-platform image build and push) lives in ci-release.yml, triggered by the product tag
# (`5.x.y`, optional `-beta.N`/`-rc.N`). This workflow tests the module and proves its image builds.
