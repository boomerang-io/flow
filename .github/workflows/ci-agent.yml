name: CI Agent
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch and tag) or pull request events
  push:
    branches:
      - main
    paths:
      - 'service-agent/**'
      - 'lib-common/**'
      - '.github/workflows/ci-agent.yml'
  pull_request:
    paths:
      - 'service-agent/**'
      - 'lib-common/**'
      - '.github/workflows/ci-agent.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Java and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: Maven Package
        env:
          GITHUB_TOKEN: ${{ github.token }} # GITHUB_TOKEN is the default env for the password
        run: |
          mvn clean test --projects service-agent --also-make --batch-mode -s settings.xml
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Java and Maven
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file
      - name: Maven Package
        env:
          GITHUB_TOKEN: ${{ github.token }} # GITHUB_TOKEN is the default env for the password
        run: |
          mvn clean package --projects service-agent --also-make --batch-mode -Dmaven.test.skip=true -s settings.xml
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: service-agent.jar
          path: service-agent/target/service-agent.jar
      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
# Release/deploy (Docker build + push) lives in ci-release.yml, triggered by the
# product tag `v@**` — see AM-9 / DD-03. This workflow only tests and builds the jar.
