name: CI E2E
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch) or pull request events
  push:
    branches:
      - main
    paths:
      - 'service-core/**'
      - 'lib-common/**'
      - 'client-web/**'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    paths:
      - 'service-core/**'
      - 'lib-common/**'
      - 'client-web/**'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/ci-e2e.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    # The whole product in Docker: the `stack` profile adds service-core and client-web to the
    # stack's Mongo, IDPZero, SeaweedFS and seeds. The dispatcher profile stays off (no cluster).
    env:
      COMPOSE_PROFILES: stack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every image builds from the checkout: the Java Dockerfiles run Maven in a build stage and
      # client-web's runs pnpm, so no host-side build precedes this.
      - name: Build stack images
        run: docker compose build service-core client-web

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Install Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version-file: client-web/.nvmrc
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stack logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down stack
        if: ${{ always() }}
        run: docker compose down -v

      - name: Slack
        uses: 8398a7/action-slack@v3
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took,job
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
