name: CI E2E
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # Triggers the workflow on push (branch) or pull request events
  push:
    branches:
      - main
    paths:
      - 'service-core/**'
      - 'client-web/**'
      - 'pom.xml'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    paths:
      - 'service-core/**'
      - 'client-web/**'
      - 'pom.xml'
      - 'e2e/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/ci-e2e.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    # The whole product in Docker: the `stack` profile adds service-core and client-web to the
    # stack's Mongo, IDPZero, SeaweedFS and seeds. The dispatcher profile stays off (no cluster).
    env:
      COMPOSE_PROFILES: stack
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every image builds from the checkout: the Java Dockerfiles run Maven in a build stage and
      # client-web's runs pnpm, so no host-side build precedes this. Buildx builds the two images
      # docker-compose.yml builds (same context and Dockerfile) with GitHub's layer cache, one scope
      # per image, and loads them under the names compose gives them (project `flow` + service), so
      # `up` starts these and pulls the rest (Mongo, IDPZero, SeaweedFS). This is the one
      # pull-request build of the service-core image (ci-core.yml runs its tests).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service-core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service-core/Dockerfile
          load: true
          tags: flow-service-core
          cache-from: type=gha,scope=flow-service-core
          cache-to: type=gha,mode=max,scope=flow-service-core

      - name: Build client-web
        uses: docker/build-push-action@v6
        with:
          context: client-web
          file: client-web/Dockerfile
          load: true
          tags: flow-client-web
          cache-from: type=gha,scope=flow-client-web
          cache-to: type=gha,mode=max,scope=flow-client-web

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Install Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version-file: client-web/.nvmrc
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stack logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down stack
        if: ${{ always() }}
        run: docker compose down -v

      - name: Slack
        if: ${{ always() }}
        uses: ./.github/actions/slack
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
