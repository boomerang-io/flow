# Local/E2E stack for the merged product: Mongo, the one-shot migration/seed Job, the
# service-core deployable, client-web, and a local IDPZero OIDC provider for real sign-in,
# fronted by a small nginx gateway that gives the browser a single origin (service-core has
# no CORS support - see docker/gateway/nginx.conf).
#
# service-dispatcher is deliberately NOT part of this stack. It drives Tekton on a real Kubernetes
# cluster (see CLAUDE.md's Technology Stack table) - there is no docker-based dispatcher yet
# (that's Phase 4 / T7 territory). Without a cluster to talk to, an agent container here would
# just crash-loop for zero E2E value: every journey this stack can prove (create a workspace,
# create a workflow, submit a run and see it reach a real `ready`/`invalid` status, exercise an
# admin screen) resolves entirely inside service-core. Only reaching `running`/`succeeded` on a
# run needs a connected agent - out of scope until Phase 4 ships a local runtime.
#
# service-core and service-loader are Java services built by Maven, NOT by this compose file.
# Build the jars first, then build/run the stack:
#
#   mvn -pl service-core,service-loader -am clean package -DskipTests
#   docker compose up --build service-loader service-core
#
# Contract: each Dockerfile does `ADD ./target/<module>.jar service.jar` with its own module
# directory as the build context (e.g. `context: ./service-core`), so it expects the ordinary
# Maven output path `service-core/target/service-core.jar` / `service-loader/target/service-loader.jar`
# to already exist - this compose file does not invoke Maven itself.
#
# client-web is built from its own `pnpm install && pnpm run build` (see .github/workflows/ci-web.yml),
# which emits client-web/build/client (browser assets) + client-web/build/server (the SSR request
# handler - SSR is on, react-router.config.ts: ssr:true) directly - both must exist before
# `docker compose build client-web` runs; see client-web/Dockerfile, which copies that build/
# directory in alongside client-web/server (the Express server wrapping the SSR handler).
#
# Security posture: this stack runs SECURED (FLOW_SECURITY_ENABLED=true). The login flow is the
# real product flow (specifications/authentication.md): the unauthenticated bootstrap lands on
# the signed-out page, Sign in runs browser-side PKCE against the local IDPZero service below,
# POST /api/v2/auth/exchange verifies the id_token via JWKS and mints the httpOnly flow_session
# cookie, and the app renders authenticated. IDPZero's login page is a passwordless user picker
# (docker/idpzero/server.yaml seeds the users); the first user to sign in on a fresh database
# becomes the founding admin. The `auth-oidc-seed` one-shot below is what flips the sign-in mode
# to `oidc` for this stack - service-loader itself seeds the OIDC settings empty on purpose.
name: flow

services:
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [flow]

  # Run-once migration + seed Job (DD-07). Must complete successfully before service-core
  # starts, or the app boots against an unmigrated database - enforced below via
  # `service_completed_successfully` rather than a fixed sleep/wait.
  service-loader:
    build:
      context: ./service-loader
      dockerfile: Dockerfile
    environment:
      FLOW_MONGO_URI: mongodb://mongo:27017/boomerang
      FLOW_MONGO_COLLECTION_PREFIX: flow
    depends_on:
      mongo:
        condition: service_healthy
    networks: [flow]
    restart: "no"

  # Local OIDC provider (see docker/idpzero/). ADDRESSING - the dual-reachability problem and
  # its solution: the issuer URL must be ONE string that works from BOTH sides, because
  #   (a) the browser hits it directly (discovery fetch, the authorize redirect, and the PKCE
  #       token POST - authClient.ts), and
  #   (b) the service-core container hits it too (OidcTokenVerifier fetches
  #       {issuer}/.well-known/openid-configuration and the advertised jwks_uri, then enforces
  #       the id_token's iss claim == the configured issuer, byte-for-byte).
  # idpzero derives its issuer (and every endpoint in the discovery document) from the request's
  # Host header, so whichever hostname both sides share becomes the issuer. That hostname is
  # `idp.localhost` (issuer http://idp.localhost:4380, seeded by auth-oidc-seed below):
  #   - host side: macOS getaddrinfo (and Chrome/Firefox per RFC 6761) resolves *.localhost to
  #     127.0.0.1, where the published 4380 port below lands on this container - so the browser,
  #     curl, and Playwright all reach it with zero /etc/hosts edits;
  #   - container side: the `idp.localhost` network alias below makes Docker's DNS resolve the
  #     same name to this container for service-core.
  # ARCHIE never hits this problem (it runs idpzero as a host binary with issuer
  # http://localhost:4379, and its backend also runs on the host); containerising both sides is
  # what forces the shared-hostname trick. Port 4380 rather than idpzero's usual 4379 for the
  # same reason: a developer with ARCHIE's host-run `idpzero serve` still up already owns
  # *:4379, and that host process would silently shadow this container's published port.
  # The browser's discovery/token fetches are cross-origin
  # (page origin localhost:8080 -> idp.localhost:4380) - fine, because idpzero's underlying
  # zitadel/oidc library serves permissive CORS on the provider endpoints, and the fetches are
  # credential-less by design.
  idpzero:
    build:
      context: ./docker/idpzero
      dockerfile: Dockerfile
    ports:
      - "4380:4380"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4380/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      flow:
        aliases:
          - idp.localhost

  # One-shot, compose-only: sets the `auth` settings document's oidc.issuer/oidc.clientId (seeded
  # empty by service-loader - correctly so for non-compose installs) to this stack's IDPZero, so
  # GET /api/v2/auth/config resolves mode=oidc. See docker/mongo/seed-auth-oidc.js.
  auth-oidc-seed:
    image: mongo:7.0
    entrypoint:
      ["mongosh", "--quiet", "mongodb://mongo:27017/boomerang", "/seed-auth-oidc.js"]
    volumes:
      - ./docker/mongo/seed-auth-oidc.js:/seed-auth-oidc.js:ro
    depends_on:
      mongo:
        condition: service_healthy
      service-loader:
        condition: service_completed_successfully
    networks: [flow]
    restart: "no"

  service-core:
    build:
      context: ./service-core
      dockerfile: Dockerfile
    ports:
      - "7700:7700"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/boomerang
      FLOW_MONGO_COLLECTION_PREFIX: flow
      FLOW_MODE: standalone
      # Secured - see the security posture note above. /health stays permitAll
      # (SecurityConfiguration), so the healthchecks here and in the gateway still pass.
      FLOW_SECURITY_ENABLED: "true"
      # Workaround for a service-core defect (REPORTED, deliberately not fixed in this change):
      # application.properties composes flow.externalUrl.platformNavigation as
      # "${users.base.url}/users/navigation", so an EMPTY users.base.url yields the non-blank,
      # host-less "/users/navigation" - ContextService.getHeaderNavigation then takes its
      # external-navigation branch (the isBlank() gate at ContextService.java:79 misses) and the
      # first authenticated bootstrap 500s with "Target host is not specified". Security-off
      # stacks never hit it because getCurrentUser() is null and the method returns early.
      # Forcing the composed property to truly-blank restores the internal-navigation branch.
      FLOW_EXTERNALURL_PLATFORMNAVIGATION: ""
    depends_on:
      mongo:
        condition: service_healthy
      service-loader:
        condition: service_completed_successfully
      # Not strictly required for boot (settings are read per-request), but deterministic:
      # the stack never serves a window where mode still resolves to `proxy`.
      auth-oidc-seed:
        condition: service_completed_successfully
      idpzero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [flow]

  client-web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Matches the basename react-router.config.ts bakes into the build ("/apps/flow") - the
      # SSR router mounts there regardless of this variable, and the browser bundle derives its
      # own URLs (including the OIDC redirect_uri, which idpzero pins byte-for-byte - see
      # docker/idpzero/server.yaml) from APP_ROOT. The previous "" here was falsy, so the
      # frontend silently fell back to the same "/apps/flow" default; stating it explicitly
      # removes the trap of reading "" as "app served at /".
      APP_ROOT: "/apps/flow"
      PORT: "3000"
      # Relative, not absolute - the browser reaches both client-web and service-core through
      # the gateway's single origin, so this stays same-origin (see docker/gateway/nginx.conf).
      PRODUCT_SERVICE_ENV_URL: /api/v2
      CORE_SERVICE_ENV_URL: /api/v2
      # Server-side only (route loaders read it directly via process.env - Config/serverFetch.ts
      # - it never reaches the browser). Direct container-to-container address on this compose
      # network, bypassing the gateway, since the SSR Node process isn't behind it. NOTE: the
      # loaders currently build request paths assuming a "/api/v2"-style prefix that only the
      # browser's PRODUCT_SERVICE_ENV_URL carries (SSR falls back to a bare "/api" default - see
      # Config/servicesConfig.ts) - that mismatch is a known, already-flagged gap upstream of this
      # file (App.tsx's loader degrades to errorLoading rather than failing render), not something
      # this compose file can paper over.
      CORE_SERVICE_INTERNAL_ORIGIN: http://service-core:7700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      service-core:
        condition: service_healthy
    networks: [flow]

  # Single browser-facing origin for the compose stack (see docker/gateway/nginx.conf for why).
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      client-web:
        condition: service_healthy
      service-core:
        condition: service_healthy
    networks: [flow]

networks:
  flow:
