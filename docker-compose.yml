# The local stack. One file, two ways to run it:
#
#   docker compose up -d                    # Mongo, IDPZero, SeaweedFS and the settings seeds;
#                                           # service-core and client-web run on the host (README,
#                                           # "Developing"). Add the dispatcher with:
#   docker compose up -d --build service-dispatcher
#
#   docker compose --profile stack up -d --build   # the whole product in Docker: what the e2e suite
#                                                  # in GitHub Actions runs (ci-e2e.yml sets
#                                                  # COMPOSE_PROFILES=stack); http://localhost:3000
#
# Every image builds from a clean checkout: the Java Dockerfiles run Maven in a build stage and
# client-web's runs pnpm, so nothing has to be built on the host first.
#
# The database lives in the `mongo_data` volume and survives `docker compose down`; `docker compose
# down -v` is the deliberate reset to an empty database.
#
# Security posture: the stack runs SECURED (FLOW_SECURITY_ENABLED=true) against the local IDPZero
# OpenID Connect provider below. Sign-in is the real product flow (specifications/authorization.md):
# the SSR server runs the code flow with PKCE against IDPZero, service-core verifies the id_token
# and mints the session cookie. IDPZero's login page is a passwordless user picker
# (docker/idpzero/server.yaml seeds the users); the first user to sign in on a fresh database
# becomes the founding admin. The auth-oidc-seed one-shot is what flips the sign-in mode to `oidc`
# for this stack: service-core's migrations seed the OIDC settings empty on purpose.
name: flow

services:
  mongo:
    image: mongo:7.0
    ports:
      # Published for service-core on the host and for a database client; loopback only.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [flow]

  # Local OIDC provider (docker/idpzero/). The issuer URL must be ONE string that works from both
  # sides: the browser follows the authorize redirect to it and the SSR server fetches discovery
  # and tokens from it, and service-core fetches the discovery document and JWKS from it and then
  # requires the id_token's iss claim to equal the configured issuer byte for byte. idpzero derives
  # its issuer from the request's Host header, so a hostname both sides share becomes the issuer:
  # `idp.localhost` (http://idp.localhost:4380, seeded by auth-oidc-seed below). On the host,
  # *.localhost resolves to 127.0.0.1, where the published port lands on this container; on the
  # compose network the alias below resolves the same name for service-core. Port 4380 rather than
  # idpzero's usual 4379 so a host-run idpzero from another project cannot shadow this one.
  idpzero:
    build:
      context: ./docker/idpzero
      dockerfile: Dockerfile
    ports:
      - "4380:4380"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4380/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      flow:
        aliases:
          - idp.localhost

  # The S3-compatible store for run artifacts (SeaweedFS, Apache-2.0): S3 on :8333, local-only
  # credentials in docker/seaweedfs/s3.json. Production uses a managed store (S3, Cloud Storage) or
  # Rook-Ceph through the same flow.artifacts.store.* settings. -ip.bind=0.0.0.0: by default every
  # port binds only the container's own address and the healthcheck's localhost probe never answers.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.telemetry=false
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [flow]

  # S3 does not create a bucket on first upload; this one-shot creates flow's (a no-op once it exists).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name flow-artifacts" | weed shell -master=seaweedfs:9333
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    networks: [flow]

  # Two one-shot settings seeds. Each waits for service-core's migrations to create the settings
  # document it edits (up to ten minutes, wherever service-core runs), applies one idempotent $set
  # and exits. See the script headers.
  #   auth-oidc-seed     points the `auth` settings at this stack's IDPZero so sign-in resolves to oidc.
  #   task-deletion-seed sets the task setting deletion.policy to Always so a finished run's storage
  #                      claim can be released (Kubernetes holds the claim while a finished pod exists).
  auth-oidc-seed:
    image: mongo:7.0
    entrypoint:
      ["mongosh", "--quiet", "mongodb://mongo:27017/boomerang", "/seed-auth-oidc.js"]
    volumes:
      - ./docker/mongo/seed-auth-oidc.js:/seed-auth-oidc.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [flow]
    restart: "no"

  task-deletion-seed:
    image: mongo:7.0
    entrypoint:
      ["mongosh", "--quiet", "mongodb://mongo:27017/boomerang", "/seed-task-deletion.js"]
    volumes:
      - ./docker/mongo/seed-task-deletion.js:/seed-task-deletion.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks: [flow]
    restart: "no"

  # Flow's Kubernetes dispatcher with the plain-Jobs executor, against a laptop cluster (OrbStack:
  # `orb config set k8s.enable true`, then restart OrbStack). It needs a kubeconfig at
  # docker/kube/config (git-ignored) whose server points at host.docker.internal: generate it with
  # `kubectl config view --context orbstack --minify --flatten --raw`, rewrite the server, and set
  # insecure-skip-tls-verify (the API certificate has no SAN for that host name).
  #
  # Behind a profile so `docker compose up -d` without a cluster does not start a dispatcher that
  # cannot work; naming the service on the command line enables the profile. It reaches
  # service-core on the host by default; set FLOW_ENGINE_SERVICE_HOST=service-core:7700 to pair it
  # with the `stack` profile instead. Dispatcher authentication is switched off on service-core
  # here (the documented dev/test escape hatch); never carry that into a real deployment.
  service-dispatcher:
    profiles: ["dispatcher"]
    build:
      context: .
      dockerfile: service-dispatcher/Dockerfile
    ports:
      - "7702:7702"
    environment:
      DISPATCHER_EXECUTOR: kube-jobs
      FLOW_DISPATCHER_NAME: orbstack-kube-jobs
      FLOW_ENGINE_SERVICE_HOST: ${FLOW_ENGINE_SERVICE_HOST:-host.docker.internal:7700}
      FLOW_ENGINE_DISPATCHER_TOKEN: ""
      FLOW_DISPATCHER_LEASE_ENABLED: "true"
      # Registered with the engine as where it reads a running task's log, with the bearer the
      # dispatcher generates at start. service-core on the host reaches the published port; set
      # FLOW_DISPATCHER_LOGS_URL=http://service-dispatcher:7702/api/v1/logs/stream with the `stack`
      # profile. A finished task's log is stored with the engine as well, when it has an artifact store.
      FLOW_DISPATCHER_LOGS_URL: ${FLOW_DISPATCHER_LOGS_URL:-http://localhost:7702/api/v1/logs/stream}
      # Spelled out rather than left to the default so the laptop cluster is an explicit place an
      # ai task can be exercised end to end. The pod runs the worker image
      # (FLOW_DISPATCHER_AI_IMAGE, boomerangio/task-ai:1.1.0 by default), released from the
      # boomerang-io/tasks repository, so the tag has to exist before an ai run gets past the pull.
      FLOW_DISPATCHER_TASK_TYPES: template,custom,script,ai,uploadartifact,downloadartifact
      # Release run-scoped storage promptly so an end-to-end run can assert the claim is gone.
      FLOW_DISPATCHER_WORKSPACE_RECONCILE_ENABLED: "true"
      FLOW_DISPATCHER_WORKSPACE_RECONCILE_MS: "10000"
      KUBECONFIG: /kube/config
      KUBERNETES_TRUST_CERTIFICATES: "true"
      # OrbStack's default StorageClass is ReadWriteOnce-only.
      KUBE_WORKSPACE_STORAGE_ACCESSMODE: ReadWriteOnce
      KUBE_TASK_TIMEOUT: "10"
    volumes:
      - ./docker/kube/config:/kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on: service-core is usually on the host. The SDK retries registration and polling,
    # and a restart covers a start before service-core is up.
    restart: unless-stopped
    healthcheck:
      # The image has no shell or wget (decision 0108); the probe is the compiled docker/health/Health.java.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-cp", "/opt/boomerang", "Health", "http://localhost:7702/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [flow]

  # The product in Docker (`stack` profile). The same values, with host addresses, are
  # service-core's `local` Spring profile for a host run.
  service-core:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: service-core/Dockerfile
    ports:
      - "7700:7700"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/boomerang
      FLOW_MONGO_COLLECTION_PREFIX: flow
      # Secured - see the security posture note above. /health stays permitAll
      # (SecurityConfiguration), so the healthcheck below still passes.
      FLOW_SECURITY_ENABLED: "true"
      # The key secured settings are encrypted with; required on every install. Local-only values.
      FLOW_ENCRYPT_SECRET: flow-local-encrypt-secret
      FLOW_ENCRYPT_SALT: flow-local-encrypt-salt
      # Artifacts go to the SeaweedFS above. Task pods reach the store through signed links, so the
      # links name the host the laptop cluster can reach, not the compose network name.
      FLOW_ARTIFACTS_ENABLED: "true"
      FLOW_ARTIFACTS_STORE_ENDPOINT: http://seaweedfs:8333
      FLOW_ARTIFACTS_STORE_LINK_ENDPOINT: http://host.docker.internal:8333
      FLOW_ARTIFACTS_STORE_BUCKET: flow-artifacts
      FLOW_ARTIFACTS_STORE_ACCESS_KEY: flow-local
      FLOW_ARTIFACTS_STORE_SECRET_KEY: flow-local-secret
      # The dispatcher above registers without a token. Live task logs are read at the URL it
      # registers (FLOW_DISPATCHER_LOGS_URL), so pair it with service-dispatcher:7702 here.
      FLOW_DISPATCHER_AUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
      idpzero:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      # The image has no shell or wget (decision 0108); the probe is the compiled docker/health/Health.java.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-cp", "/opt/boomerang", "Health", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [flow]

  # client-web's own SSR server is the single browser-facing origin and the only thing the browser
  # talks to: documents, /res/* resource routes and .data requests, never /api/*. Every service-core
  # call happens server-side via CORE_SERVICE_INTERNAL_ORIGIN (src/Config/serverFetch.ts), so
  # service-core needs no CORS; its own :7700 stays reachable for integrations and the dispatcher.
  client-web:
    profiles: ["stack"]
    build:
      context: ./client-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Matches the basename react-router.config.ts bakes into the build: the browser bundle derives
      # its URLs, including the OIDC redirect_uri that idpzero pins byte for byte
      # (docker/idpzero/server.yaml), from APP_ROOT.
      APP_ROOT: "/apps/flow"
      PORT: "3000"
      # Written into window._SERVER_DATA by the root loader for the few places that surface an API
      # URL (the copyable webhook and event trigger URLs); relative so they render the
      # deployment's own origin.
      PRODUCT_SERVICE_ENV_URL: /api/v2
      # Server-side only: the container-to-container address of service-core.
      CORE_SERVICE_INTERNAL_ORIGIN: http://service-core:7700
    healthcheck:
      # The probe is a resource route under the webapp's base path (client-web/app/routes/health.tsx).
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/apps/flow/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      service-core:
        condition: service_healthy
      # The browser-facing origin only opens once sign-in resolves to `oidc`, never `proxy`.
      auth-oidc-seed:
        condition: service_completed_successfully
      # A one-shot that nothing depends on counts as a failed container to `up --wait`; this
      # dependency is what lets it exit, and the deletion policy is in place before any test runs.
      task-deletion-seed:
        condition: service_completed_successfully
    networks: [flow]

volumes:
  mongo_data:
  seaweedfs_data:

networks:
  flow:
