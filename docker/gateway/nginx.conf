worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Unifies client-web and service-core under one origin so the browser's API calls (issued
  # directly by axios to PRODUCT_SERVICE_ENV_URL, see client-web/src/Config/servicesConfig.ts)
  # are same-origin. service-core has no CORS configuration (by design - it expects an
  # authenticating reverse proxy in front of it in real deployments, see
  # specifications/authentication.md), so a cross-port browser call would otherwise be blocked.
  # This container plays that reverse-proxy role for the compose stack.
  client_max_body_size 20m;
  proxy_read_timeout 600s;

  server {
    listen 80;

    # service-core's REST API - path already includes /api/v1 (dispatcher) or /api/v2
    # (platform), so proxy_pass with no trailing path preserves the incoming URI unchanged.
    location /api/ {
      proxy_pass http://service-core:7700;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://service-core:7700;
      proxy_set_header Host $host;
    }

    # Everything else is the webapp (client-web's own Express/SSR server).
    location / {
      proxy_pass http://client-web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
